# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Bound each build so concurrent worktrees leave room for tests and emulators.
org.gradle.parallel=true
org.gradle.warning.mode=all
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Xss4m
org.gradle.workers.max=4
# Keep warm daemons between edits, but release memory after fifteen idle minutes.
org.gradle.daemon.idletimeout=900000
# Kotlin has a separate heap; do not let it inherit Gradle's heap limit.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -Xss4m
systemProp.kotlin.daemon.options=autoshutdownIdleSeconds=900

android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Cache is causeing issues with CircleCI nad maybe Studio 2021
# org.gradle.unsafe.configuration-cache=true

android.nonFinalResIds=true

# AGP 9 defaults to false, which lets compile classpaths resolve older versions than runtime.
android.dependency.useConstraints=true
# Keep library alignment; suppress only AGP's import-performance advisory.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Dagger's ComponentProcessingStep cannot resolve modules generated by another
# processor (dagger.android's @ContributesAndroidInjector -> ActivitiesModule_Contributes*)
# when their originating source is not part of KSP's incremental dirty set. The first
# build after any source change fails with "could not be resolved"; rerunning succeeds.
# See https://github.com/google/dagger/issues/4878. Disabling KSP incremental processing
# makes each KSP run self-contained and costs nothing on up-to-date builds.
ksp.incremental=false
