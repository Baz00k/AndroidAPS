name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator:
        description: Run the startup benchmark on a fresh emulator
        type: boolean
        default: false
      api-level:
        description: Android emulator API level
        type: string
        default: '35'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Xss4m"
    -Dkotlin.daemon.jvm.options=-Xmx2g
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.caching=true

jobs:
  # `build` is a required check: skipping it (rather than not triggering the
  # workflow) reports success, so draft and docs-only PRs stay mergeable.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'push' }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          predicate-quantifier: every
          filters: |
            build:
              - '**'
              - '!**/*.md'
              - '!_docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.idea/**'
              - '!.run/**'
              - '!**/*.bat'
              - '!LICENSE.txt'
              - '!codecov.yml'
              - '!crowdin.yml'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Caches dependencies and task outputs; only main writes the cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install native build prerequisites
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build-tool tests
        run: ./gradlew -p buildSrc test --console=plain
      - name: Build and unit tests
        run: >-
          ./gradlew unitTest
          :app:assembleFullDebug :app:assembleFullLoop
          :wear:assembleFullDebug :wear:assembleFullLoop
          :benchmark:assembleFullLoop --continue --console=plain
      - name: Enable emulator acceleration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated startup benchmark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :benchmark:connectedFullLoopAndroidTest -PaapsTargetAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --console=plain
      - name: Upload test reports
        if: ${{ failure() || inputs.emulator }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          retention-days: 7
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            benchmark/build/outputs/androidTest-results/**
            benchmark/build/reports/androidTests/**
            benchmark/build/outputs/connected_android_test_additional_output/**
