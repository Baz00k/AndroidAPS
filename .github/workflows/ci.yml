name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator:
        description: Run database fixtures and startup benchmark on a fresh emulator
        type: boolean
        default: false
      api-level:
        description: Android emulator API level
        type: string
        default: '35'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -Xss4m"
    -Dkotlin.daemon.jvm.options=-Xmx1g
    -Dorg.gradle.workers.max=2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install native build prerequisites
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build-tool tests
        run: ./gradlew -p buildSrc test --console=plain
      - name: Build and unit tests
        run: >-
          ./gradlew unitTest
          :app:assembleFullDebug :app:assembleFullLoop
          :wear:assembleFullDebug :wear:assembleFullLoop
          :benchmark:assembleFullLoop --continue --console=plain
      - name: Enable emulator acceleration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated database fixtures and startup benchmark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell getprop ro.build.fingerprint
            ./gradlew :database:impl:connectedFullDebugAndroidTest :benchmark:connectedFullLoopAndroidTest -PaapsTargetAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --no-parallel --continue --console=plain
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            benchmark/build/outputs/connected_android_test_additional_output/**
