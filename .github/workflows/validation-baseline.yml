name: Validation evidence (not release qualification)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Evidence collector tests
        run: python3 -m unittest discover -s tools/validation -v
      - name: Install build prerequisites
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clean build and unit evidence
        id: build-evidence
        run: >-
          python3 tools/validation/baseline.py
          --output "$RUNNER_TEMP/aaps-baseline"
          --abi x86_64
          --gradle-arg='-Dorg.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Xss4m'
          --gradle-arg=-Dkotlin.daemon.jvm.options=-Xmx1g
      - name: Fresh-emulator cold-start harness
        if: ${{ !cancelled() && steps.build-evidence.outcome != 'skipped' }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          # One bounded tooling configuration, not oldest/latest or Samsung qualification.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" > "$RUNNER_TEMP/aaps-baseline/emulator-image.log"
            adb shell getprop > "$RUNNER_TEMP/aaps-baseline/emulator-properties.log"
            "$ANDROID_HOME/emulator/emulator" -no-window -version > "$RUNNER_TEMP/aaps-baseline/emulator-version.log" 2>&1
            ./gradlew :benchmark:connectedFullLoopAndroidTest -PaapsTargetAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --console=plain --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:+UseParallelGC -Xss4m' > "$RUNNER_TEMP/aaps-baseline/emulator-test.log" 2>&1
      - name: Upload diagnostic evidence only
        if: ${{ !cancelled() && steps.build-evidence.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.sha }}
          # No keystores, APK publication, patient data, or real pairing credentials.
          path: |
            ${{ runner.temp }}/aaps-baseline/summary.json
            ${{ runner.temp }}/aaps-baseline/test-tasks.json
            ${{ runner.temp }}/aaps-baseline/*.log
            ${{ runner.temp }}/aaps-baseline/test-results/
            benchmark/build/outputs/connected_android_test_additional_output/
            benchmark/build/outputs/androidTest-results/
          if-no-files-found: error
