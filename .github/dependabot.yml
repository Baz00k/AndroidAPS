version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one PR; majors stay separate.
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
