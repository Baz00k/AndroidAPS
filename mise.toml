[tools]
android-sdk = "23.0"

[tasks.build]
description = "Build the phone APK"
run = "./gradlew :app:assembleFullLoop"

[tasks."build:debug"]
description = "Build the phone APK with debugging enabled"
run = "./gradlew :app:assembleFullDebug"

[tasks."build:wear"]
description = "Build the Wear OS APK"
run = "./gradlew :wear:assembleFullLoop"

[tasks."build:wear:debug"]
description = "Build the Wear OS APK with debugging enabled"
run = "./gradlew :wear:assembleFullDebug"

[tasks.install]
description = "Build and install the phone APK"
confirm = "Install the phone APK on connected devices? This may update an app used for live therapy."
run = "./gradlew :app:installFullLoop"

[tasks."install:debug"]
description = "Build and install the phone APK with debugging enabled"
confirm = "Install the debug phone APK on connected devices? This may update an app used for live therapy."
run = "./gradlew :app:installFullDebug"

[tasks."install:wear"]
description = "Build and install the Wear OS APK"
confirm = "Install the Wear OS APK on connected devices? This may update an app used for live therapy."
run = "./gradlew :wear:installFullLoop"

[tasks."install:wear:debug"]
description = "Build and install the Wear OS APK with debugging enabled"
confirm = "Install the debug Wear OS APK on connected devices? This may update an app used for live therapy."
run = "./gradlew :wear:installFullDebug"

[tasks.test]
description = "Run Android and JVM unit tests"
run = "./gradlew unitTest"
