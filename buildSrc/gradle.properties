# buildSrc is a separate build and is also invoked directly by CI.
# Match the root build's resource budgets so it does not inherit an oversized Kotlin heap.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Xss4m
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=900000
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -Xss4m
systemProp.kotlin.daemon.options=autoshutdownIdleSeconds=900
